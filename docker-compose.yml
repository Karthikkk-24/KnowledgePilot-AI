services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowledgepilot-postgres
    restart: unless-stopped
    ports:
      # 5433 on host avoids clashing with a local Homebrew/Postgres.app on 5432
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: knowledgepilot
    volumes:
      - knowledgepilot_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d knowledgepilot']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: knowledgepilot-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  knowledgepilot_pg_data:
