name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @knowledgepilot/rag test
      - run: pnpm --filter @knowledgepilot/config test
      - run: pnpm --filter @knowledgepilot/rag build
      - run: pnpm --filter @knowledgepilot/db exec prisma generate
      - run: pnpm --filter @knowledgepilot/api typecheck
      - run: pnpm --filter @knowledgepilot/web typecheck

  eval-smoke:
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knowledgepilot
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d knowledgepilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/knowledgepilot?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      APP_PORT: 3001
      APP_WEB_ORIGIN: http://localhost:3000
      FF_HYBRID_SEARCH: 'true'
      FF_RERANKING: 'false'
      STORAGE_LOCAL_PATH: ./uploads
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @knowledgepilot/rag build
      - run: pnpm --filter @knowledgepilot/config build
      - run: pnpm --filter @knowledgepilot/logger build
      - run: pnpm --filter @knowledgepilot/shared build
      - run: pnpm --filter @knowledgepilot/db build
      - run: pnpm db:migrate
      - run: pnpm --filter @knowledgepilot/api build
      - name: Start API
        run: |
          pnpm --filter @knowledgepilot/api start &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3001/health >/dev/null; then
              echo API_READY
              exit 0
            fi
            sleep 1
          done
          echo "API failed to become ready"
          exit 1
      - run: pnpm eval:smoke
